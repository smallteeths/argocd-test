apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Argo CD Test</title>
    </head>
    <body style="font-family:sans-serif;text-align:center;padding:80px">
      <h1>{{ .Values.message | html }}</h1>
      <p>Managed by Argo CD + Helm</p>
    </body>
    </html>
